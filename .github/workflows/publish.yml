name: Publish to NuGet

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

jobs:
  # Runs all third-party build and test code (npm, vite, vitest, NuGet) with read-only permissions, so none of it can
  # request the OIDC token that publishes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # One branch carries both lines, so a tag publishes only from main.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Version files match the tag
        run: bash build/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Umbraco.Community.UserActivity/Client/.nvmrc

      # The same client gates as build.yml, so a tag never publishes a client that CI did not check.
      - name: Client build, XSS guard, tests and wwwroot drift
        run: |
          cd src/Umbraco.Community.UserActivity/Client
          npm ci --ignore-scripts
          npm run build
          npm test
          cd ../../..
          bash build/check-xss.sh
          git diff --exit-code -- src/Umbraco.Community.UserActivity/wwwroot
          test -z "$(git status --porcelain -- src/Umbraco.Community.UserActivity/wwwroot)"

      # No NuGet cache here (cache: true is deliberately absent): a release never restores from a PR-filled cache.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      # Both lines are restored (locked), built, tested and checked for known advisories before anything is packed.
      - name: Build, test and audit both lines
        run: |
          while read -r line; do
            [ -n "$line" ] || continue
            echo "== Umbraco $line"
            dotnet restore src/Umbraco.Community.UserActivity.slnx "-p:UmbracoMajor=$line" --locked-mode
            dotnet build src/Umbraco.Community.UserActivity.slnx --no-restore -c Release "-p:UmbracoMajor=$line"
            dotnet test src/Umbraco.Community.UserActivity.slnx --no-build -c Release "-p:UmbracoMajor=$line"
            UmbracoMajor="$line" bash build/check-vulnerable.sh
          done < eng/lines.txt

      # One nupkg per line (17.x and 18.x), each carrying wwwroot. Only the package is packed: tests and the demo site
      # are IsPackable=false. pack.sh stamps the line's version into the manifest and restores it afterwards.
      - name: Pack
        run: bash build/pack.sh ./artifacts

      - name: One package per line
        run: |
          shopt -s nullglob
          packs=(./artifacts/*.nupkg)
          [ "${#packs[@]}" -eq 2 ] || { echo "expected 2 nupkgs, found ${#packs[@]}" >&2; exit 1; }
          # Each package must carry the client bundle.
          for f in "${packs[@]}"; do
            unzip -l "$f" | grep -q 'staticwebassets/index.js' || { echo "$f has no staticwebassets/index.js" >&2; exit 1; }
          done

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  # Holds the only step that can mint the OIDC token: it checks out nothing and runs no project code, only downloads
  # the packages the build job made and pushes them.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # A required reviewer approves each publish; the environment only accepts release/* tags (see .github/REPO-SETUP.md).
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing (OIDC): no long-lived API key

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      # Needs the repository secret NUGET_USER (the nuget.org profile name, not a key) and a Trusted Publishing
      # policy on nuget.org for this repository and workflow file (see .github/REPO-SETUP.md).
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"

